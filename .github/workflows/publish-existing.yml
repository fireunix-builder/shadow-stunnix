name: Publish verified tunnel artifacts to R2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-verified-tunnel-artifacts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download Control artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: fireunix-builder/shadow-control
          run-id: 34631731980
          path: incoming/Control
      - name: Download STunnix artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: fireunix-builder/shadow-stunnix
          run-id: 34631735329
          path: incoming/STunnix
      - name: Download CTunnix artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: fireunix-builder/shadow-ctunnix
          run-id: 34631739298
          path: incoming/CTunnix
      - name: Verify and upload release packages
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python3 scripts/publish_verified_tunnel_artifacts.py
