name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source branch, tag, or commit"
        required: true
        default: "main"
        type: string
      version:
        description: "Release version, for example v0.1.1"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: Validate source and version
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-stunnix
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: ${RELEASE_TAG}" >&2
            exit 1
          fi
          cargo_version="$(awk -F '"' '/^version = "/ { print $2; exit }' source/Cargo.toml)"
          if [[ "${RELEASE_TAG#v}" != "${cargo_version}" ]]; then
            echo "release version does not match Cargo.toml ${cargo_version}" >&2
            exit 1
          fi
          source_sha="$(git -C source rev-parse HEAD)"
          tag_object="$(GH_TOKEN="${SOURCE_REPO_PAT}" gh api \
            "repos/fireunix-app/shadow-stunnix/git/ref/tags/${RELEASE_TAG}")"
          tag_sha="$(jq -r '.object.sha' <<<"${tag_object}")"
          if [[ "$(jq -r '.object.type' <<<"${tag_object}")" == "tag" ]]; then
            tag_sha="$(GH_TOKEN="${SOURCE_REPO_PAT}" gh api \
              "repos/fireunix-app/shadow-stunnix/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          if [[ "${source_sha}" != "${tag_sha}" ]]; then
            echo "::error::Release tag does not match the private source revision."
            exit 1
          fi
          echo "number=${cargo_version}" >> "${GITHUB_OUTPUT}"
          rm -rf source

      - name: Restore cargo-zigbuild cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cargo-home/bin/cargo-zigbuild
          key: cargo-zigbuild-0.23.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-zigbuild
        shell: bash
        run: |
          if [[ ! -x "${CARGO_HOME}/bin/cargo-zigbuild" ]]; then
            cargo install cargo-zigbuild --version 0.23.0 --locked
          fi

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-stunnix
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source

      - name: Restore public dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
          key: stunnix-cargo-v2-${{ runner.os }}-${{ hashFiles('source/Cargo.lock') }}
          restore-keys: |
            stunnix-cargo-v2-${{ runner.os }}-

      - name: Test private source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          private_log="${RUNNER_TEMP}/private-test.log"
          set +e
          (
            set -euo pipefail
            cargo fmt --check
            cargo test --locked
          ) >"${private_log}" 2>&1
          status=$?
          set -e
          rm -f "${private_log}"
          if (( status != 0 )); then
            echo "::error::Private source tests failed; detailed output was intentionally withheld."
            exit "${status}"
          fi

      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf source

  build-portable:
    name: Build ${{ matrix.platform }} ${{ matrix.release_target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.compiled-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            rust_target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu.2.17
            release_target: amd64
            zig: true
          - runner: ubuntu-24.04
            platform: linux
            rust_target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu.2.17
            release_target: arm64
            zig: true
          - runner: ubuntu-24.04
            platform: linux
            rust_target: armv7-unknown-linux-gnueabihf
            build_target: armv7-unknown-linux-gnueabihf.2.17
            release_target: armv7
            zig: true
          - runner: ubuntu-24.04
            platform: openwrt
            rust_target: x86_64-unknown-linux-musl
            build_target: x86_64-unknown-linux-musl
            release_target: amd64
            zig: true
          - runner: ubuntu-24.04
            platform: openwrt
            rust_target: aarch64-unknown-linux-musl
            build_target: aarch64-unknown-linux-musl
            release_target: arm64
            zig: true
          - runner: ubuntu-24.04
            platform: openwrt
            rust_target: armv7-unknown-linux-musleabihf
            build_target: armv7-unknown-linux-musleabihf
            release_target: armv7
            zig: true
          - runner: macos-15-intel
            platform: macos
            rust_target: x86_64-apple-darwin
            build_target: x86_64-apple-darwin
            release_target: amd64
            zig: false
          - runner: macos-15
            platform: macos
            rust_target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            release_target: arm64
            zig: false
          - runner: windows-2025
            platform: windows
            rust_target: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
            release_target: amd64
            zig: false
          - runner: windows-2025
            platform: windows
            rust_target: aarch64-pc-windows-msvc
            build_target: aarch64-pc-windows-msvc
            release_target: arm64
            zig: false
    steps:
      - name: Check out public builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Zig
        if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-stunnix
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source

      - name: Restore public dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
          key: stunnix-cargo-v2-${{ runner.os }}-${{ hashFiles('source/Cargo.lock') }}
          restore-keys: |
            stunnix-cargo-v2-${{ runner.os }}-

      - name: Restore cargo-zigbuild cache
        if: matrix.zig
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cargo-home/bin/cargo-zigbuild
          key: cargo-zigbuild-0.23.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-zigbuild
        if: matrix.zig
        shell: bash
        run: |
          if [[ ! -x "${CARGO_HOME}/bin/cargo-zigbuild" ]]; then
            cargo install cargo-zigbuild --version 0.23.0 --locked
          fi

      - name: Read Rust version
        if: matrix.platform == 'macos'
        id: rust-version
        shell: bash
        run: echo "number=$(rustc --version | awk '{print $2}')" >> "${GITHUB_OUTPUT}"

      - name: Restore compiled dependency cache
        if: matrix.platform == 'macos'
        id: compiled-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .compiled-target
          key: stunnix-compiled-v2-${{ runner.os }}-${{ matrix.rust_target }}-${{ steps.rust-version.outputs.number }}-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}
          restore-keys: |
            stunnix-compiled-v2-${{ runner.os }}-${{ matrix.rust_target }}-${{ steps.rust-version.outputs.number }}-

      - name: Build and package Unix release
        if: matrix.platform != 'windows'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TARGET: ${{ matrix.release_target }}
          RUST_TARGET: ${{ matrix.rust_target }}
          USE_ZIG: ${{ matrix.zig }}
          VERSION_NUMBER: ${{ needs.prepare.outputs.number }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          private_log="${RUNNER_TEMP}/private-build.log"
          set +e
          (
            set -euo pipefail
            cd source
            if [[ "${USE_ZIG}" == "true" ]]; then
              RUSTFLAGS="-C strip=symbols" cargo zigbuild \
                --release --locked --target "${BUILD_TARGET}"
            else
              RUSTFLAGS="-C strip=symbols" cargo build \
                --release --locked --target "${BUILD_TARGET}" --bin STunnix
            fi

            archive="stunnix-${VERSION_NUMBER}-${PLATFORM}-${RELEASE_TARGET}"
            package_dir="../dist/${archive}"
            mkdir -p "${package_dir}/conf"
            install -m 0755 "${CARGO_TARGET_DIR}/${RUST_TARGET}/release/STunnix" "${package_dir}/STunnix"
            install -m 0644 conf/dev.toml "${package_dir}/conf/example.toml"
            install -m 0644 ../builder/README.md "${package_dir}/README.md"
            if [[ "${PLATFORM}" == "linux" ]]; then
              mkdir -p "${package_dir}/scripts"
              install -m 0644 deploy/stunnix.service "${package_dir}/stunnix.service"
              install -m 0755 scripts/linux-network-tuning.sh "${package_dir}/scripts/linux-network-tuning.sh"
            fi
            tar -C ../dist -czf "../dist/${archive}.tar.gz" "${archive}"
          ) >"${private_log}" 2>&1
          status=$?
          set -e
          rm -f "${private_log}"
          if (( status != 0 )); then
            echo "::error::Private source build failed; detailed output was intentionally withheld."
            exit "${status}"
          fi

      - name: Build Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        working-directory: source
        run: |
          $privateLog = Join-Path $env:RUNNER_TEMP "private-build.log"
          cargo build --release --locked --target $env:RUST_TARGET --bin STunnix *> $privateLog
          $status = $LASTEXITCODE
          Remove-Item $privateLog -ErrorAction SilentlyContinue
          if ($status -ne 0) {
            Write-Error "Private source build failed; detailed output was intentionally withheld."
            exit $status
          }

      - name: Package Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.release_target }}
          RUST_TARGET: ${{ matrix.rust_target }}
          VERSION_NUMBER: ${{ needs.prepare.outputs.number }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "stunnix-$env:VERSION_NUMBER-windows-$env:RELEASE_TARGET"
          $packageDir = "dist/$archive"
          New-Item -ItemType Directory -Force "$packageDir/conf" | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/$env:RUST_TARGET/release/STunnix.exe" "$packageDir/STunnix.exe"
          Copy-Item "source/conf/dev.toml" "$packageDir/conf/example.toml"
          Copy-Item "builder/README.md" "$packageDir/README.md"
          Compress-Archive -Path $packageDir -DestinationPath "dist/$archive.zip" -Force

      - name: Scrub first-party compiled artifacts
        if: matrix.platform == 'macos'
        shell: bash
        run: python3 builder/scripts/scrub-rust-target.py "${CARGO_TARGET_DIR}" stunnix

      - name: Save compiled dependency cache
        if: matrix.platform == 'macos' && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .compiled-target
          key: stunnix-compiled-v2-${{ runner.os }}-${{ matrix.rust_target }}-${{ steps.rust-version.outputs.number }}-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}

      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf source

      - name: Store release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stunnix-${{ matrix.platform }}-${{ matrix.release_target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  build-bsd:
    name: Build ${{ matrix.platform }} ${{ matrix.release_target }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: freebsd
            vm_arch: x86_64
            release_target: amd64
            compiled_cache: true
          - platform: freebsd
            vm_arch: aarch64
            release_target: arm64
            compiled_cache: true
          - platform: openbsd
            vm_arch: x86_64
            release_target: amd64
            compiled_cache: true
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "32"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.compiled-target
      PLATFORM: ${{ matrix.platform }}
      RELEASE_TARGET: ${{ matrix.release_target }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.number }}
    steps:
      - name: Check out public builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder

      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-stunnix
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source

      - name: Restore public dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
          key: stunnix-cargo-v2-${{ matrix.platform }}-${{ hashFiles('source/Cargo.lock') }}
          restore-keys: |
            stunnix-cargo-v2-${{ matrix.platform }}-

      - name: Restore compiled dependency cache
        if: matrix.compiled_cache
        id: compiled-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .compiled-target
          key: stunnix-compiled-v2-${{ matrix.platform }}-${{ matrix.release_target }}-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}
          restore-keys: |
            stunnix-compiled-v2-${{ matrix.platform }}-${{ matrix.release_target }}-

      - name: Build and package in FreeBSD
        if: matrix.platform == 'freebsd'
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1
        with:
          release: "14.4"
          arch: ${{ matrix.vm_arch }}
          cpu: 4
          mem: 12288
          usesh: true
          sync: rsync
          envs: >-
            CARGO_HOME CARGO_INCREMENTAL CARGO_BUILD_JOBS CARGO_TARGET_DIR
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS CARGO_PROFILE_RELEASE_LTO
            CARGO_PROFILE_RELEASE_OPT_LEVEL PLATFORM RELEASE_TARGET VERSION_NUMBER
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            env ASSUME_ALWAYS_YES=yes pkg install rust cmake perl5 pkgconf
          run: |
            set -eu
            cd source
            archive="stunnix-${VERSION_NUMBER}-${PLATFORM}-${RELEASE_TARGET}"
            package_dir="../dist/${archive}"
            private_log="/tmp/private-build.log"
            set +e
            RUSTFLAGS="-C strip=symbols" cargo build --release --locked --bin STunnix >"${private_log}" 2>&1
            status=$?
            set -e
            rm -f "${private_log}"
            if [ "${status}" -ne 0 ]; then
              echo "Private source build failed; detailed output was intentionally withheld." >&2
              exit "${status}"
            fi
            mkdir -p "${package_dir}/conf"
            install -m 0755 "${CARGO_TARGET_DIR}/release/STunnix" "${package_dir}/STunnix"
            install -m 0644 conf/dev.toml "${package_dir}/conf/example.toml"
            install -m 0644 ../builder/README.md "${package_dir}/README.md"
            tar -C ../dist -czf "../dist/${archive}.tar.gz" "${archive}"

      - name: Build and package in OpenBSD
        if: matrix.platform == 'openbsd'
        uses: vmactions/openbsd-vm@c941015845c0f0c429676840963dc63b226d4f69 # v1.4.5
        with:
          release: "7.9"
          arch: ${{ matrix.vm_arch }}
          cpu: 4
          mem: 12288
          usesh: true
          sync: rsync
          envs: >-
            CARGO_HOME CARGO_INCREMENTAL CARGO_BUILD_JOBS CARGO_TARGET_DIR
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS CARGO_PROFILE_RELEASE_LTO
            CARGO_PROFILE_RELEASE_OPT_LEVEL PLATFORM RELEASE_TARGET VERSION_NUMBER
          prepare: pkg_add rust cmake gmake llvm pkgconf
          run: |
            set -eu
            cd source
            archive="stunnix-${VERSION_NUMBER}-${PLATFORM}-${RELEASE_TARGET}"
            package_dir="../dist/${archive}"
            private_log="/tmp/private-build.log"
            set +e
            RUSTFLAGS="-C strip=symbols" cargo build --release --locked --bin STunnix >"${private_log}" 2>&1
            status=$?
            set -e
            rm -f "${private_log}"
            if [ "${status}" -ne 0 ]; then
              echo "Private source build failed; detailed output was intentionally withheld." >&2
              exit "${status}"
            fi
            mkdir -p "${package_dir}/conf"
            install -m 0755 "${CARGO_TARGET_DIR}/release/STunnix" "${package_dir}/STunnix"
            install -m 0644 conf/dev.toml "${package_dir}/conf/example.toml"
            install -m 0644 ../builder/README.md "${package_dir}/README.md"
            tar -C ../dist -czf "../dist/${archive}.tar.gz" "${archive}"

      - name: Scrub first-party compiled artifacts
        if: matrix.compiled_cache
        shell: bash
        run: python3 builder/scripts/scrub-rust-target.py "${CARGO_TARGET_DIR}" stunnix

      - name: Save compiled dependency cache
        if: matrix.compiled_cache && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .compiled-target
          key: stunnix-compiled-v2-${{ matrix.platform }}-${{ matrix.release_target }}-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}

      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf source

      - name: Store release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stunnix-${{ matrix.platform }}-${{ matrix.release_target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  warm-openbsd-arm64-1:
    name: Warm OpenBSD arm64 dependencies (1/2)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "32"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.openbsd-arm64-target
    steps:
      - name: Check out public builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder

      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-stunnix
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source

      - name: Restore public dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
          key: stunnix-cargo-v2-openbsd-${{ hashFiles('source/Cargo.lock') }}
          restore-keys: |
            stunnix-cargo-v2-openbsd-

      - name: Restore compiled dependency checkpoint
        id: compiled-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .openbsd-arm64-target
          key: stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-stable
          restore-keys: |
            stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-
            stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-checkpoint-

      - name: Compile dependency checkpoint in OpenBSD
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        uses: vmactions/openbsd-vm@c941015845c0f0c429676840963dc63b226d4f69 # v1.4.5
        with:
          release: "7.9"
          arch: aarch64
          cpu: 4
          mem: 12288
          usesh: true
          sync: rsync
          envs: >-
            CARGO_HOME CARGO_INCREMENTAL CARGO_BUILD_JOBS CARGO_TARGET_DIR
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS CARGO_PROFILE_RELEASE_LTO
            CARGO_PROFILE_RELEASE_OPT_LEVEL
          prepare: pkg_add rust cmake gmake llvm pkgconf coreutils
          run: |
            set -eu
            if [ -f "${CARGO_TARGET_DIR}/.third-party-deps-complete" ]; then
              exit 0
            fi
            cd source
            private_log="/tmp/private-build.log"
            set +e
            gtimeout --signal=TERM --kill-after=30s 240m \
              env RUSTFLAGS="-C strip=symbols" \
              cargo build --release --locked --lib >"${private_log}" 2>&1
            status=$?
            set -e
            rm -f "${private_log}"
            case "${status}" in
              0)
                touch "${CARGO_TARGET_DIR}/.third-party-deps-complete"
                ;;
              124|137)
                ;;
              *)
                echo "Private source build failed; detailed output was intentionally withheld." >&2
                exit "${status}"
                ;;
            esac

      - name: Scrub first-party compiled artifacts
        if: always()
        shell: bash
        run: python3 builder/scripts/scrub-rust-target.py "${CARGO_TARGET_DIR}" stunnix

      - name: Inspect checkpoint state
        if: success()
        id: checkpoint-state
        shell: bash
        run: |
          if [[ -f "${CARGO_TARGET_DIR}/.third-party-deps-complete" ]]; then
            echo "complete=true" >> "${GITHUB_OUTPUT}"
          else
            echo "complete=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save completed dependency cache
        if: steps.compiled-cache.outputs.cache-hit != 'true' && steps.checkpoint-state.outputs.complete == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .openbsd-arm64-target
          key: stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-stable

      - name: Save dependency checkpoint
        if: steps.compiled-cache.outputs.cache-hit != 'true' && steps.checkpoint-state.outputs.complete != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .openbsd-arm64-target
          key: stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-1

      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf source

  warm-openbsd-arm64-2:
    name: Warm OpenBSD arm64 dependencies (2/2)
    needs:
      - prepare
      - warm-openbsd-arm64-1
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "32"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.openbsd-arm64-target
    steps:
      - name: Check out public builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder

      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-stunnix
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source

      - name: Restore public dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
          key: stunnix-cargo-v2-openbsd-${{ hashFiles('source/Cargo.lock') }}
          restore-keys: |
            stunnix-cargo-v2-openbsd-

      - name: Restore compiled dependency checkpoint
        id: compiled-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .openbsd-arm64-target
          key: stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-stable
          restore-keys: |
            stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-
            stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-checkpoint-

      - name: Compile dependency checkpoint in OpenBSD
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        uses: vmactions/openbsd-vm@c941015845c0f0c429676840963dc63b226d4f69 # v1.4.5
        with:
          release: "7.9"
          arch: aarch64
          cpu: 4
          mem: 12288
          usesh: true
          sync: rsync
          envs: >-
            CARGO_HOME CARGO_INCREMENTAL CARGO_BUILD_JOBS CARGO_TARGET_DIR
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS CARGO_PROFILE_RELEASE_LTO
            CARGO_PROFILE_RELEASE_OPT_LEVEL
          prepare: pkg_add rust cmake gmake llvm pkgconf coreutils
          run: |
            set -eu
            if [ -f "${CARGO_TARGET_DIR}/.third-party-deps-complete" ]; then
              exit 0
            fi
            cd source
            private_log="/tmp/private-build.log"
            set +e
            gtimeout --signal=TERM --kill-after=30s 240m \
              env RUSTFLAGS="-C strip=symbols" \
              cargo build --release --locked --lib >"${private_log}" 2>&1
            status=$?
            set -e
            rm -f "${private_log}"
            case "${status}" in
              0)
                touch "${CARGO_TARGET_DIR}/.third-party-deps-complete"
                ;;
              124|137)
                ;;
              *)
                echo "Private source build failed; detailed output was intentionally withheld." >&2
                exit "${status}"
                ;;
            esac

      - name: Scrub first-party compiled artifacts
        if: always()
        shell: bash
        run: python3 builder/scripts/scrub-rust-target.py "${CARGO_TARGET_DIR}" stunnix

      - name: Inspect checkpoint state
        if: success()
        id: checkpoint-state
        shell: bash
        run: |
          if [[ -f "${CARGO_TARGET_DIR}/.third-party-deps-complete" ]]; then
            echo "complete=true" >> "${GITHUB_OUTPUT}"
          else
            echo "complete=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save completed dependency cache
        if: steps.compiled-cache.outputs.cache-hit != 'true' && steps.checkpoint-state.outputs.complete == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .openbsd-arm64-target
          key: stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-stable

      - name: Save dependency checkpoint
        if: steps.compiled-cache.outputs.cache-hit != 'true' && steps.checkpoint-state.outputs.complete != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .openbsd-arm64-target
          key: stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-2

      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf source

  build-openbsd-arm64:
    name: Build openbsd arm64
    needs:
      - prepare
      - warm-openbsd-arm64-2
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "32"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.openbsd-arm64-target
      PLATFORM: openbsd
      RELEASE_TARGET: arm64
      VERSION_NUMBER: ${{ needs.prepare.outputs.number }}
    steps:
      - name: Check out public builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder

      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-stunnix
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source

      - name: Restore public dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
          key: stunnix-cargo-v2-openbsd-${{ hashFiles('source/Cargo.lock') }}
          restore-keys: |
            stunnix-cargo-v2-openbsd-

      - name: Restore compiled dependency checkpoint
        id: compiled-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .openbsd-arm64-target
          key: stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-stable
          restore-keys: |
            stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-
            stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-checkpoint-

      - name: Build and package in OpenBSD
        uses: vmactions/openbsd-vm@c941015845c0f0c429676840963dc63b226d4f69 # v1.4.5
        with:
          release: "7.9"
          arch: aarch64
          cpu: 4
          mem: 12288
          usesh: true
          sync: rsync
          envs: >-
            CARGO_HOME CARGO_INCREMENTAL CARGO_BUILD_JOBS CARGO_TARGET_DIR
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS CARGO_PROFILE_RELEASE_LTO
            CARGO_PROFILE_RELEASE_OPT_LEVEL PLATFORM RELEASE_TARGET VERSION_NUMBER
          prepare: pkg_add rust cmake gmake llvm pkgconf
          run: |
            set -eu
            cd source
            archive="stunnix-${VERSION_NUMBER}-${PLATFORM}-${RELEASE_TARGET}"
            package_dir="../dist/${archive}"
            private_log="/tmp/private-build.log"
            set +e
            RUSTFLAGS="-C strip=symbols" cargo build --release --locked --bin STunnix >"${private_log}" 2>&1
            status=$?
            set -e
            rm -f "${private_log}"
            if [ "${status}" -ne 0 ]; then
              echo "Private source build failed; detailed output was intentionally withheld." >&2
              exit "${status}"
            fi
            touch "${CARGO_TARGET_DIR}/.third-party-deps-complete"
            mkdir -p "${package_dir}/conf"
            install -m 0755 "${CARGO_TARGET_DIR}/release/STunnix" "${package_dir}/STunnix"
            install -m 0644 conf/dev.toml "${package_dir}/conf/example.toml"
            install -m 0644 ../builder/README.md "${package_dir}/README.md"
            tar -C ../dist -czf "../dist/${archive}.tar.gz" "${archive}"

      - name: Scrub first-party compiled artifacts
        if: always()
        shell: bash
        run: python3 builder/scripts/scrub-rust-target.py "${CARGO_TARGET_DIR}" stunnix

      - name: Save completed dependency cache
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .openbsd-arm64-target
          key: stunnix-openbsd-arm64-target-v1-${{ hashFiles('source/Cargo.lock', 'source/Cargo.toml') }}-stable

      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf source

      - name: Store release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stunnix-openbsd-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: inputs.publish
    needs:
      - prepare
      - test
      - build-portable
      - build-bsd
      - build-openbsd-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stunnix-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Install release tools
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          command -v gh >/dev/null
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSLo /tmp/awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi

      - name: Upload release artifacts to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          RELEASE_TAG: ${{ inputs.version }}
          VERSION_NUMBER: ${{ needs.prepare.outputs.number }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is not configured}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is not configured}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is not configured}"
          : "${R2_BUCKET:?R2_BUCKET is not configured}"
          : "${R2_PUBLIC_URL:?R2_PUBLIC_URL is not configured}"

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="STunnix/${RELEASE_TAG}"
          public_url="${R2_PUBLIC_URL%/}"

          aws s3 sync dist "s3://${R2_BUCKET}/${prefix}/" \
            --endpoint-url "${endpoint}" \
            --exclude "*" \
            --include "*.tar.gz" \
            --include "*.zip" \
            --include "SHA256SUMS" \
            --cache-control "public,max-age=0,must-revalidate" \
            --only-show-errors

          files_json="$(
            for asset in dist/*.tar.gz dist/*.zip; do
              test -e "${asset}" || continue
              file="$(basename "${asset}")"
              key="${file#stunnix-${VERSION_NUMBER}-}"
              key="${key%.tar.gz}"
              key="${key%.zip}"
              sha="$(awk -v name="./${file}" '$2 == name { print $1 }' dist/SHA256SUMS)"
              test -n "${sha}"
              jq -n \
                --arg key "${key}" \
                --arg url "${public_url}/${prefix}/${file}" \
                --arg sha256 "${sha}" \
                '{key: $key, value: {url: $url, sha256: $sha256}}'
            done | jq -s 'from_entries'
          )"
          files_json="$(
            jq \
              '. + {amd64: .["linux-amd64"], arm64: .["linux-arm64"]}' \
              <<< "${files_json}"
          )"
          jq -e '.amd64 and .arm64' <<< "${files_json}" >/dev/null

          jq -n \
            --arg version "${RELEASE_TAG}" \
            --arg released_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg checksums_url "${public_url}/${prefix}/SHA256SUMS" \
            --argjson files "${files_json}" \
            '{
              version: $version,
              released_at: $released_at,
              files: $files,
              checksums_url: $checksums_url
            }' > dist/latest.json

          aws s3 cp dist/latest.json "s3://${R2_BUCKET}/STunnix/latest.json" \
            --endpoint-url "${endpoint}" \
            --content-type "application/json" \
            --cache-control "no-cache,max-age=0" \
            --only-show-errors

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}
          RELEASE_TAG: ${{ inputs.version }}
          TARGET_REPOSITORY: fireunix-app/shadow-stunnix
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?RELEASE_REPO_PAT is not configured}"
          [[ "${TARGET_REPOSITORY}" == fireunix-app/* ]]
          [[ "$(gh api "repos/${TARGET_REPOSITORY}" --jq '.private')" == "true" ]]
          if ! gh api "repos/${TARGET_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag must already exist in the private source repository."
            exit 1
          fi
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          if gh release view "${RELEASE_TAG}" --repo "${TARGET_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --clobber \
              --repo "${TARGET_REPOSITORY}"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            "${assets[@]}" \
            --repo "${TARGET_REPOSITORY}" \
            --verify-tag \
            --title "STunnix ${RELEASE_TAG}" \
            --notes "Multi-platform binaries built from the configured private source ref."
